     WhatsApp reads these STATIC tags — it doesn't run JavaScript — so every
     guest link shows this same elegant invitation preview. The personal RSVP
     link still lands each guest on their own pre-filled form. ══ -->
<title>You're Invited 💍 · Chamo & Pamu</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="preconnect" href="https://bqggtyguhedlyfffjkkw.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#C9A84C; --gold-d:#a5842f; --dark:#3d2e1a; --cream:#faf7f0; --muted:#8a7a60; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Jost',sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #fff8ea 0%, transparent 60%),
      linear-gradient(180deg,#fdfbf5,#f3ecdd);
    color:var(--dark);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;overflow:hidden;position:relative;
  }
  /* soft floating ornaments */
  .bg-orn{position:fixed;font-size:22px;opacity:.10;user-select:none;pointer-events:none;animation:drift 9s ease-in-out infinite}
  .card{
    position:relative;text-align:center;max-width:420px;width:100%;
    background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
    border:1px solid rgba(201,168,76,.28);border-radius:26px;
    padding:48px 34px;box-shadow:0 24px 70px rgba(61,46,26,.14);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .ring{font-size:34px;animation:sway 3s ease-in-out infinite;display:inline-block}
  .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-d);margin:18px 0 10px;font-weight:500}
  .names{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,10vw,54px);line-height:1.02;color:var(--dark)}
  .names .amp{color:var(--gold);font-style:italic;padding:0 8px}
  .rule{display:flex;align-items:center;gap:12px;justify-content:center;margin:20px auto 18px;max-width:200px}
  .rule .ln{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent)}
  .rule .dot{color:var(--gold);font-size:11px}
  .date{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--dark);letter-spacing:.02em}
  .venue{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .status{margin-top:30px;display:flex;align-items:center;justify-content:center;gap:11px;color:var(--muted);font-size:13px;letter-spacing:.04em}
  .spinner{width:22px;height:22px;border:2.5px solid rgba(201,168,76,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
  .manual{margin-top:22px;font-size:13px}
  .manual a{color:var(--gold-d);font-weight:500;text-decoration:none;border-bottom:1px solid rgba(201,168,76,.4);padding-bottom:1px}
  .err{margin-top:14px;color:#b23;font-size:13px;display:none}

  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="bg-orn" style="top:14%;left:12%">✦</div>
  <div class="bg-orn" style="top:22%;right:14%;animation-delay:1.5s">❀</div>
  <div class="bg-orn" style="bottom:18%;left:18%;animation-delay:2.5s">✦</div>
  <div class="bg-orn" style="bottom:24%;right:16%;animation-delay:3.5s">❀</div>

  <div class="card">
    <span class="ring">💍</span>
    <div class="eyebrow">You're Invited</div>
    <div class="names">Chamo <span class="amp">&amp;</span> Pamu</div>
    <div class="rule"><span class="ln"></span><span class="dot">✦</span><span class="ln"></span></div>
    <div class="date">Thursday, 11 February 2027</div>
    <div class="venue">Golden Crown Hotel · Kandy</div>

    <div class="status" id="status">
      <span class="spinner"></span><span>Opening your invitation…</span>
    </div>
    <div class="manual" id="manual" style="display:none">
      <a href="#" id="manualLink">Tap here to open your invitation →</a>
    </div>
    <div class="err" id="err">This invitation link doesn't look right. Please ask the couple for a fresh one.</div>
  </div>

<script>
var SB = 'https://bqggtyguhedlyfffjkkw.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZ2d0eWd1aGVkbHlmZmZqa2t3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3NTA0NzYsImV4cCI6MjA4ODMyNjQ3Nn0.x3tpbzhI-W4kR7MPFexPW-MZ5Ei_bkE7Nw5Q00Tx7J4';

function showErr(){
  document.getElementById('status').style.display='none';
  document.getElementById('err').style.display='block';
}
function showManual(url){
  document.getElementById('status').style.display='none';
  const m = document.getElementById('manual');
  document.getElementById('manualLink').href = url;
  m.style.display='block';
}

(async function(){
  const params = new URLSearchParams(location.search);
  const code = params.get('c');
  if(!code){ showErr(); return; }

  try{
    const r = await fetch(SB+'/rest/v1/rpc/rsvp_lookup', {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':KEY},
      body: JSON.stringify({ p_code: code })
    });
    const d = await r.json();
    if(!d || !d.gid || !d.slug){ showErr(); return; }

    const dest = '/wedding.html?slug=' + encodeURIComponent(d.slug) + '&gid=' + encodeURIComponent(d.gid);
    // Give the elegant card a brief moment, then go.
    document.querySelector('#status span:last-child').textContent = 'Taking you there…';
    showManual(dest);                 // fallback link in case auto-redirect is blocked
    setTimeout(()=>{ location.replace(dest); }, 900);
  }catch(e){ showErr(); }
})();
</script>
</body>
</html>
